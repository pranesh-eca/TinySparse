name: TinySparse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel

    - name: Run all host tests
      run: ctest --test-dir build --output-on-failure

    - name: Install exporter dependency
      run: python -m pip install 'numpy>=1.23,<2'

    - name: Verify model exporter
      run: python -m unittest discover -s tests -p test_exporter.py
